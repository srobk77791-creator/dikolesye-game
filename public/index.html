function itemCount(id,slots=state.p.slots){return slots.reduce((n,s)=>n+(s?.id===id?s.qty:0),0)}

function putSlots(slots,id,qty){const max=ITEMS[id].stack;for(const s of slots){if(s?.id===id&&s.qty<max){const n=Math.min(max-s.qty,qty);s.qty+=n;qty-=n;if(!qty)return 0}}for(let i=0;i<slots.length&&qty>0;i++)if(!slots[i]){const n=Math.min(max,qty);slots[i]={id,qty:n};qty-=n}return qty}
function takeSlots(slots,id,qty){if(itemCount(id,slots)<qty)return false;for(let i=0;i<slots.length&&qty>0;i++)if(slots[i]?.id===id){const n=Math.min(qty,slots[i].qty);slots[i].qty-=n;qty-=n;if(!slots[i].qty)slots[i]=null}return true}

function help(){modal('Как играть','help',`<p>/ — чат (клавиша меняется в настройках), N — кланы. PvP включено вне лагеря; соклановцы защищены от урона друг друга. Первый старт — безопасное место. Каменная кирка, топор и дубинка занимают первые три быстрых слота. Рюкзак слева добавляет ещё 30 ячеек. Руды и меча на старте нет. День длится 15 минут, ночь — 10 минут. Факел создаётся в крафте и освещает ночь, когда выбран в руку. Онлайн-мир не останавливается, пока открыты меню или сумка.</p><div class="controls" id="desktopHelp"><b>WASD / стрелки</b><span>Движение. Через деревья и руду не пройти; кусты замедляют в 2,1 раза.</span><b>1–9 / 0</b><span>Выбор одного из 10 слотов.</span><b>Мышь + ЛКМ</b><span>Удар, выстрел, использование выбранной еды или установка постройки.</span><b>E</b><span>Добыть выбранным инструментом, подобрать предмет, открыть сундук, набрать воду или вызвать босса.</span><b>B / Tab / Esc</b><span>Крафт / инвентарь / меню.</span><b>Q / R</b><span>Поесть / попить. У озера можно пить без фляги.</span><b>F / ПКМ</b><span>Удерживать щит. Нужен надетый щит и выносливость; блок работает спереди.</span><b>Shift / X</b><span>Спринт / разобрать постройку.</span></div><div id="mobileHelp"><p>Джойстик — движение. ⚔ — атака. ✋ — взаимодействие. Еда и вода — отдельные кнопки. «Щит» нужно удерживать. Снизу — 10 быстрых слотов. Кнопка рюкзака слева открывает ещё 30 ячеек.</p></div><p>Предмет после крафта оказывается в сумке, не включается автоматически. Шапки, броню, щиты и сапоги надевай через инвентарь. Каждый ресурс или боеприпас занимает слот, но складывается в стопку.</p><p>Переполнение: лишние ресурсы лежат на земле. E — подобрать. Сделай сундук (15 дерева, 5 камня): он хранит 20 стопок. Разбор сундука возвращает сундук и выкладывает содержимое на землю.</p><p>Куст даёт ягоды и волокно, камень иногда даёт уголь, звери — мясо и кожу. Для еды нужен костёр. Древний: 2570 : 610, 5 кристаллов. Король кабанов: 610 : 2530. При смерти снаряжение сохраняется, теряется четверть расходников.</p><p>Дерево добывается только топором, камень и руды — только киркой. Выбери инструмент в панели слотов. Мечи, дубинки и другое оружие наносят ресурсам в 15 / 20 раз меньше урона и не дают добычи даже при разрушении. E не переключает тебя на инструмент автоматически. Боевой урон оружия по мобам не уменьшен.</p><p class="sub">Одна кнопка «Играть» подключает к общему острову. Пока это гостевой PvP · кланыный прототип без Google-входа и PvP. Гостевой ключ хранится в этом браузере; не делись им. Меню не останавливает сервер. Бесплатный хостинг может терять прогресс при перезапуске.</p>`)}

function nodeRadius(n){return n.type==='tree'?30:28}
function solid(x,y,r=18){if(x<r||y<r||x>WORLD-r||y>WORLD-r)return true;return state.builds.some(b=>b.hp>0&&(b.type==='wall'||b.type==='chest')&&Math.abs(x-b.x)<r+23&&Math.abs(y-b.y)<r+23)||state.builds.some(b=>b.hp>0&&b.type==='turret'&&Math.hypot(x-b.x,y-b.y)<r+23)||state.nodes.some(n=>!n.respawn&&n.type!=='berries'&&Math.hypot(x-n.x,y-n.y)<r+nodeRadius(n));}
function inBush(x,y){return state.nodes.some(n=>!n.respawn&&n.type==='berries'&&Math.hypot(x-n.x,y-n.y)<40)}
function repairPoint(e,r=18){e.x=clamp(e.x,r,WORLD-r);e.y=clamp(e.y,r,WORLD-r);if(!solid(e.x,e.y,r))return true;const x=e.x,y=e.y;for(let radius=12;radius<700;radius+=12)for(let i=0;i<24;i++){const xx=clamp(x+Math.cos(i*Math.PI/12)*radius,r,WORLD-r),yy=clamp(y+Math.sin(i*Math.PI/12)*radius,r,WORLD-r);if(!solid(xx,yy,r)&&!inWater(xx,yy)){e.x=xx;e.y=yy;return true}}return false;}
function move(e,dx,dy,r=18){if(e.type==='bird'){e.x=clamp(e.x+dx,30,WORLD-30);e.y=clamp(e.y+dy,30,WORLD-30);return}const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/6));for(let i=0;i<steps;i++){if(!solid(e.x+dx/steps,e.y,r))e.x+=dx/steps;if(!solid(e.x,e.y+dy/steps,r))e.y+=dy/steps}}

function hitNode(n,d=held(),animate=true){if(n.respawn>0)return;const p=state.p,isBush=n.type==='berries',matching=!isBush&&d.kind==='tool'&&d.sprite===(n.type==='tree'?'axe':'pick');n.hit=.16;if(animate)p.swing=.2;const hit=isBush?1:matching?(d.mine||1)+equipmentStat('gather'):1/(n.type==='tree'?15:20);n.hp=Math.max(-10,n.hp-hit);if(n.hp<1e-9)n.hp=0;particles(n.x,n.y,n.type==='tree'?'#90be65':'#d3b6a1');beep(180,.04);if(n.hp>0){if(!isBush&&!matching&&animate)toast(n.type==='tree'?'Нужен топор: оружие наносит 1/15 урона и не добывает дерево':'Нужна кирка: оружие наносит 1/20 урона и не добывает руду');return}n.respawn=isBush?35:90;if(isBush||matching){const id=n.type==='tree'?'wood':n.type,qty=(id==='berries'?5:id==='wood'?7:id==='crystal'?3:5)*(p.char==='miner'?2:1);receive(id,qty,n.x,n.y);if(isBush)receive('fiber',4,n.x,n.y);if(id==='stone'&&Math.random()<.75)receive('coal',3,n.x,n.y);}else if(animate)toast('Разрушено без добычи. Используй '+(n.type==='tree'?'топор':'кирку'));syncUI();}

// Original, editable vector sprites: organic silhouettes and recognisable tools.
const art={grass:'#82ac59',line:'#2f4432'};
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function circle(x,y,r,c){ellipse(x,y,r,r,c)}
function rect(x,y,a,b,c){ctx.fillStyle=c;ctx.fillRect(x,y,a,b)}
function text(t,x,y,c='#fff7dd',size=12){ctx.fillStyle=c;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function orb(x,y,rx,ry,color,outline=art.line,lw=2.8,c=ctx){c.fillStyle=color;c.strokeStyle=outline;c.lineWidth=lw;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();if(lw)c.stroke()}
function poly(points,color,outline=art.line,lw=2.5,c=ctx){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=color;c.fill();if(lw){c.lineJoin='round';c.strokeStyle=outline;c.lineWidth=lw;c.stroke()}}
function line(points,color,width=3,c=ctx){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.lineCap='round';c.lineJoin='round';c.lineWidth=width;c.strokeStyle=color;c.stroke()}
function rounded(x,y,w,h,r,color,outline=art.line,lw=2,c=ctx){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=color;c.fill();if(lw){c.strokeStyle=outline;c.lineWidth=lw;c.stroke()}}
function groundShadow(rx,ry){if(cfg.graphics==='high'){const g=ctx.createRadialGradient(4,7,2,4,7,rx);g.addColorStop(0,'#17352140');g.addColorStop(1,'#17352100');ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=g;ctx.beginPath();ctx.arc(4,7,rx,0,7);ctx.fill();ctx.restore()}else ellipse(5,8,rx,ry,'#1f412330')}
function drawTool(kind,c=ctx){c.save();c.lineJoin='round';c.lineCap='round';
if(kind==='sword'||kind==='blade'){rounded(0,-3,14,6,3,'#795032','#342f24',2,c);poly([[14,-5],[42,-5],[54,0],[42,5],[14,5]],kind==='blade'?'#c8b7ff':'#d7e5e3','#384c4d',2,c);line([[18,-2],[42,-2],[48,0]],'#f7ffff',1.7,c);rounded(12,-10,5,20,2,'#cda659','#5a4e35',2,c);orb(0,0,3,4,'#d8b365','#5d4c32',1,c)}
else if(kind==='axe'||kind==='pick'){line([[0,0],[39,0]],'#3d3427',8,c);line([[0,-1],[39,-1]],'#b58a55',5,c);line([[3,1],[32,1]],'#d6ae73',1,c);if(kind==='axe'){c.beginPath();c.moveTo(31,-3);c.lineTo(31,-14);c.quadraticCurveTo(39,-15,42,-29);c.bezierCurveTo(55,-25,59,-12,53,1);c.quadraticCurveTo(45,2,37,-4);c.closePath();c.fillStyle='#9dafb5';c.fill();c.strokeStyle='#35494a';c.lineWidth=2.5;c.stroke();c.beginPath();c.moveTo(42,-29);c.bezierCurveTo(55,-25,59,-12,53,1);c.lineTo(49,-1);c.bezierCurveTo(54,-13,50,-23,40,-25);c.closePath();c.fillStyle='#eaf4ee';c.fill();line([[36,-12],[41,-19]],'#cbdad5',2,c);rounded(30,-5,8,9,2,'#6d8588','#314b48',2,c)}else{c.beginPath();c.moveTo(30,-3);c.quadraticCurveTo(30,-17,47,-27);c.quadraticCurveTo(40,-11,39,0);c.quadraticCurveTo(40,10,47,22);c.quadraticCurveTo(29,14,30,3);c.closePath();c.fillStyle='#b6c9ca';c.fill();c.strokeStyle='#364c4c';c.lineWidth=2.5;c.stroke();line([[33,-2],[39,-16]],'#eef8f1',2,c);orb(34,0,4,5,'#657e7d','#364c4c',1.5,c)}}
else if(kind==='bow'){c.beginPath();c.moveTo(19,-25);c.quadraticCurveTo(48,0,19,25);c.strokeStyle='#38472d';c.lineWidth=7;c.stroke();c.strokeStyle='#bc8a48';c.lineWidth=4;c.stroke();line([[19,-25],[14,0],[19,25]],'#e9dcbc',1.5,c);line([[8,0],[45,0]],'#d6be88',2,c);poly([[45,-3],[53,0],[45,3]],'#e3ebd8','#5a6c5c',1,c);line([[8,-4],[14,0],[8,4]],'#f2e4be',2,c)}
else if(kind==='gun'){poly([[4,1],[18,0],[20,8],[12,19],[5,16]],'#8b5c3f','#35443b',2.5,c);rounded(10,-9,34,13,3,'#839c9e','#314649',2.5,c);rounded(18,-11,14,16,4,'#b7c8c6','#3a5150',2,c);line([[34,-6],[47,-6]],'#e7eee4',2,c);line([[43,-10],[43,-5]],'#354a45',2,c);c.strokeStyle='#34463f';c.lineWidth=2;c.beginPath();c.arc(20,8,7,0,Math.PI);c.stroke();line([[8,6],[14,8]],'#c29b70',2,c)}
else if(kind==='wall'){rounded(6,-19,37,38,4,'#a6a694','#4b5f50',2.5,c);line([[7,-2],[42,-2]],'#5d6c59',2,c);line([[24,-18],[24,-3]],'#5d6c59',2,c);line([[16,0],[16,17]],'#5d6c59',2,c);line([[34,0],[34,17]],'#5d6c59',2,c);line([[9,-15],[19,-15]],'#dbe0c7',2,c)}
else if(kind==='turret'){orb(24,8,19,10,'#6a8c81','#3a554b',2,c);rounded(12,-9,23,19,5,'#b3c5bb','#3b534d',2,c);rounded(21,-26,8,21,3,'#7a9893','#365149',2,c);orb(24,0,4,4,'#eac46e','#705b3c',1,c)}
else if(kind==='fire'){line([[8,8],[39,17]],'#805d3b',7,c);line([[8,17],[39,8]],'#a87f4b',7,c);poly([[12,10],[16,-5],[23,0],[29,-21],[38,-4],[36,12]],'#ffb356','#824e34',2,c);poly([[21,10],[27,-4],[32,10]],'#ffe8a0','#ffe8a0',0,c)}
c.restore()}
function drawItem(id,c=ctx){const d=ITEMS[id];if(!d)return;const s=d.sprite;c.save();c.lineJoin='round';c.lineCap='round';
if(['pick','axe','sword','blade','bow','gun','wall','turret','fire'].includes(s)){if(id.startsWith('stone_'))c.filter='grayscale(1)';if(id==='wood_sword')c.filter='sepia(1) saturate(1.8)';if(id.startsWith('gold_'))c.filter='sepia(1) saturate(2)';drawTool(s,c);c.filter='none';if(id.startsWith('crystal_'))poly([[22,-4],[27,0],[22,4],[17,0]],'#cab2ee','#635577',1,c);if(id.startsWith('steel_'))line([[20,-1],[32,-1]],'#f3f8ee',1.5,c)}
